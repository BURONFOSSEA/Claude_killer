<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f12">
  <meta name="robots" content="noindex">
  <title>Killer · Joueur</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Connexion -->
  <main id="login" class="hero hidden">
    <form id="loginForm" class="card">
      <h1>KILL<span>ER</span></h1>
      <p class="dim">Entre le code personnel donné par l'organisateur.</p>
      <div class="field">
        <label for="code" class="hidden">Code</label>
        <input id="code" class="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="XXXXXX" required>
      </div>
      <button class="primary block big" type="submit">Entrer</button>
      <p class="small dim mt"><a href="./">← Accueil</a></p>
    </form>
  </main>

  <!-- Tableau de bord joueur -->
  <div id="app" class="hidden">
    <header class="topbar">
      <a class="brand" href="player.html">KILL<span>ER</span></a>
      <div class="actions">
        <button id="refreshBtn" class="ghost sm" type="button" aria-label="Rafraîchir">↻</button>
        <button id="logoutBtn" class="ghost sm" type="button">Déconnexion</button>
      </div>
    </header>
    <main class="wrap narrow" id="view"></main>
    <section class="wrap narrow pt-0" id="messages"></section>
    <section class="wrap narrow pt-0" id="notif"></section>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/player.js"></script>
</body>
</html>
