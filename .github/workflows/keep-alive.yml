# Les projets Supabase gratuits se mettent en pause après 7 jours sans activité.
# Ce script interroge le serveur tous les 3 jours pour le garder actif.
name: Garder Supabase actif

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api/health"
